name: Motif Analytics
description: 'Motif Analytics was a startup (founded 2021 by Mikhail Panko and Theron Ji, with
  Sean Taylor as chief scientist) building interactive sequence analytics for growth and operations
  teams. Its product let analysts explore event sequences — user journeys, funnels, order-management
  flows — with a purpose-built Sequence Operations Language (SOL) and in-browser WebAssembly so data
  never had to leave the browser, backed by a $5.7M seed round led by Amplify Partners and Felicis
  (2024). As of this enrichment pass the product site and the docs.motifanalytics.com subdomain no
  longer resolve and motifanalytics.com serves a MarkMonitor brand-protection holding page, indicating
  the company has wound down. No public REST/GraphQL API, SDK, OpenAPI, CLI, or developer surface was
  ever published; the sole public GitHub repo is a 2023 bug reproduction.'
